<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MAISON — the idle house of design</title>
<meta name="description" content="MAISON is an idle design-house game: earn Taste, hire studios across Fashion, Automotive and Interiors, commission Drops, complete collections, and show the season for permanent renown." />
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* minimal reset + the utility classes the game uses (Tailwind-compatible names) */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button { border: none; background: none; font: inherit; color: inherit; padding: 0; cursor: pointer; }
  button:disabled { cursor: default; }

  .min-h-screen { min-height: 100vh; }
  .flex { display: flex; }
  .flex-1 { flex: 1 1 0%; }
  .flex-col { flex-direction: column; }
  .grid { display: grid; }
  .grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .gap-2 { gap: 8px; }
  .items-center { align-items: center; }
  .items-end { align-items: flex-end; }
  .items-baseline { align-items: baseline; }
  .justify-center { justify-content: center; }
  .justify-between { justify-content: space-between; }

  .relative { position: relative; }
  .absolute { position: absolute; }
  .fixed { position: fixed; }
  .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
  .top-0 { top: 0; } .bottom-0 { bottom: 0; } .left-0 { left: 0; } .right-0 { right: 0; }
  .bottom-4 { bottom: 16px; }
  .z-50 { z-index: 50; }
  .pointer-events-none { pointer-events: none; }

  .w-full { width: 100%; }
  .h-full { height: 100%; }
  .max-w-md { max-width: 448px; }
  .max-w-xs { max-width: 320px; }
  .mx-auto { margin-left: auto; margin-right: auto; }

  .p-4 { padding: 16px; }
  .p-6 { padding: 24px; }
  .px-1 { padding-left: 4px; padding-right: 4px; }
  .px-4 { padding-left: 16px; padding-right: 16px; }
  .px-5 { padding-left: 20px; padding-right: 20px; }
  .px-6 { padding-left: 24px; padding-right: 24px; }
  .px-8 { padding-left: 32px; padding-right: 32px; }
  .py-0\.5 { padding-top: 2px; padding-bottom: 2px; }
  .py-2 { padding-top: 8px; padding-bottom: 8px; }
  .py-3 { padding-top: 12px; padding-bottom: 12px; }
  .pt-6 { padding-top: 24px; }
  .pt-8 { padding-top: 32px; }
  .pb-4 { padding-bottom: 16px; }
  .pb-5 { padding-bottom: 20px; }
  .pb-24 { padding-bottom: 96px; }

  .mt-1 { margin-top: 4px; }
  .mt-3 { margin-top: 12px; }
  .mt-4 { margin-top: 16px; }
  .mt-5 { margin-top: 20px; }
  .mt-6 { margin-top: 24px; }
  .mt-7 { margin-top: 28px; }
  .mt-8 { margin-top: 32px; }
  .mb-1 { margin-bottom: 4px; }
  .mb-2 { margin-bottom: 8px; }
  .mb-6 { margin-bottom: 24px; }

  .text-center { text-align: center; }
  .text-right { text-align: right; }

  .transition-transform { transition: transform .15s ease; }
  .active\:scale-95:active { transform: scale(.95); }
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
